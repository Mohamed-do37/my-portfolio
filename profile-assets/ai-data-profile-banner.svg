<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="680" viewBox="0 0 1600 680" role="img" aria-labelledby="title desc">
<title id="title">Mohamed Dogheim — Future AI and Data Intelligence</title>
<desc id="desc">Large cinematic holographic artificial intelligence core, with rotating luminous orbital rings, pulsing energy waves, neural connections, moving data particles, and a futuristic analytics interface in a deep navy cyan identity.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020611"/><stop offset=".5" stop-color="#07172D"/><stop offset="1" stop-color="#020917"/></linearGradient>
 <radialGradient id="atmos"><stop stop-color="#087EA4" stop-opacity=".32"/><stop offset=".46" stop-color="#164E9A" stop-opacity=".13"/><stop offset="1" stop-color="#020611" stop-opacity="0"/></radialGradient>
 <radialGradient id="core"><stop stop-color="#CFFAFE"/><stop offset=".16" stop-color="#67E8F9"/><stop offset=".42" stop-color="#0891B2"/><stop offset=".72" stop-color="#164E91"/><stop offset="1" stop-color="#071426"/></radialGradient>
 <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#D9FBFF"/><stop offset=".32" stop-color="#67E8F9"/><stop offset=".7" stop-color="#22D3EE"/><stop offset="1" stop-color="#6366F1"/></linearGradient>
 <linearGradient id="beam"><stop stop-color="#22D3EE" stop-opacity="0"/><stop offset=".5" stop-color="#A5F3FC"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></linearGradient>
 <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B2943" stop-opacity=".94"/><stop offset="1" stop-color="#071426" stop-opacity=".82"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="6" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="bloom"><feGaussianBlur stdDeviation="22"/></filter>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1B4665" stroke-width=".8" opacity=".42"/></pattern>
 <pattern id="fine" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M8 0H0V8" fill="none" stroke="#1B4665" stroke-width=".5" opacity=".23"/></pattern>
</defs>
<!-- immersive deep-space canvas -->
<rect width="1600" height="680" rx="28" fill="url(#bg)"/>
<rect width="1600" height="680" rx="28" fill="url(#grid)"/>
<rect width="1600" height="680" rx="28" fill="url(#fine)"/>
<ellipse cx="820" cy="335" rx="620" ry="410" fill="url(#atmos)"/>
<ellipse cx="820" cy="335" rx="240" ry="240" fill="#0891B2" opacity=".12" filter="url(#bloom)"><animate attributeName="opacity" values=".06;.2;.06" dur="5s" repeatCount="indefinite"/></ellipse>
