    <g fill="#38BDF8">
      <rect x="32" y="158" width="16" height="22" rx="3"><animate attributeName="height" values="22;34;22" dur="3s" repeatCount="indefinite"/><animate attributeName="y" values="158;146;158" dur="3s" repeatCount="indefinite"/></rect>
      <rect x="65" y="140" width="16" height="40" rx="3"><animate attributeName="height" values="40;27;40" dur="2.7s" repeatCount="indefinite"/><animate attributeName="y" values="140;153;140" dur="2.7s" repeatCount="indefinite"/></rect>
      <rect x="98" y="124" width="16" height="56" rx="3"><animate attributeName="height" values="56;67;56" dur="3.3s" repeatCount="indefinite"/><animate attributeName="y" values="124;113;124" dur="3.3s" repeatCount="indefinite"/></rect>
      <rect x="131" y="103" width="16" height="77" rx="3"/>
      <rect x="164" y="83" width="16" height="97" rx="3"><animate attributeName="height" values="97;82;97" dur="3.6s" repeatCount="indefinite"/><animate attributeName="y" values="83;98;83" dur="3.6s" repeatCount="indefinite"/></rect>
    </g>
    <text x="22" y="195" fill="#8CAFC8" font-size="9" letter-spacing="1.7">PATTERNS  /  SIGNALS  /  INSIGHTS</text>
