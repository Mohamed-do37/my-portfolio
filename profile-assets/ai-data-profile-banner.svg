  <g fill="#67E8F9" opacity=".8">
    <circle cx="380" cy="170" r="2.5"><animate attributeName="cx" values="360;875;360" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="360" cy="225" r="2"><animate attributeName="cx" values="360;875;360" dur="8s" repeatCount="indefinite"/></circle>
  </g>
  <path d="M36 316H1164" stroke="#1A3852" stroke-width="1"/>
  <text x="40" y="339" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" letter-spacing="2" fill="#7198B5">MACHINE LEARNING  •  ANALYTICS  •  INTELLIGENT SYSTEMS</text>
  <text x="1160" y="339" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" letter-spacing="1.6" fill="#38BDF8">DATA → INSIGHT</text>
</svg>