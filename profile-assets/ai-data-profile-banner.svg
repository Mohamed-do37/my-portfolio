  <path d="M16 19h13m-5 -5 5 5 -5 5" fill="none" stroke="#67E8F9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="39" y="23" fill="#E0FCFF" font-size="10" font-weight="700" letter-spacing=".7">EXPLORE PROJECTS</text>
