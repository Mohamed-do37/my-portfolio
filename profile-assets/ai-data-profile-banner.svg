  </g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="390" y="70" fill="#E6F6FF" font-size="29" font-weight="700" letter-spacing="3">AI  ×  DATA INTELLIGENCE</text>
    <text x="392" y="98" fill="#8CAFC8" font-size="13" letter-spacing="2.6">FROM RAW DATA TO MEANINGFUL INSIGHTS</text>
