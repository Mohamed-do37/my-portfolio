<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">AI and Data Intelligence</title>
  <desc id="desc">Animated neural network, flowing data, and analytics charts in a dark navy and cyan technology theme.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/><stop offset=".55" stop-color="#0A1B33"/><stop offset="1" stop-color="#06101F"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/><stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8" stop-opacity=".08"/><stop offset=".5" stop-color="#38BDF8" stop-opacity=".9"/><stop offset="1" stop-color="#67E8F9" stop-opacity=".15"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#17314B" stroke-width="1" opacity=".55"/></pattern>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)" opacity=".8"/>
  <circle cx="210" cy="174" r="120" fill="#0EA5E9" opacity=".055"><animate attributeName="r" values="112;128;112" dur="6s" repeatCount="indefinite"/></circle>
  <circle cx="990" cy="170" r="140" fill="#22D3EE" opacity=".045"><animate attributeName="r" values="132;148;132" dur="7s" repeatCount="indefinite"/></circle>
  <g stroke="#38BDF8" stroke-width="1.6" stroke-opacity=".55" fill="none">
    <path d="M72 90L132 135L90 207L164 247L224 176L275 105L322 170L278 245L224 176L132 135L275 105"/>
    <path d="M90 207L224 176L164 247L278 245L322 170"/>
    <path d="M132 135L164 247M72 90L275 105" stroke-opacity=".25"/>
  </g>
  <g fill="#67E8F9" filter="url(#glow)">
    <circle cx="72" cy="90" r="4"><animate attributeName="r" values="3;5;3" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="132" cy="135" r="5"><animate attributeName="r" values="4;6;4" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="90" cy="207" r="4"/>
    <circle cx="164" cy="247" r="5"><animate attributeName="r" values="4;6;4" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="224" cy="176" r="6"><animate attributeName="opacity" values=".55;1;.55" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="275" cy="105" r="4"/>
    <circle cx="322" cy="170" r="5"><animate attributeName="r" values="3;5;3" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="278" cy="245" r="4"/>
  </g>
  <g fill="none" stroke="url(#line)" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="7 15">
    <path d="M335 170C395 170 395 120 455 120S520 170 575 170S650 115 710 115S770 170 830 170S900 125 955 125"><animate attributeName="stroke-dashoffset" from="0" to="-88" dur="5s" repeatCount="indefinite"/></path>
